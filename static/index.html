<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PharmaXotira Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --primary-color: #3498db;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      text-align: center;
      margin-bottom: 15px;
      width: 100%;
      max-width: 380px;
    }
    .header h1 {
      font-size: 1.3rem;
      margin: 0 0 10px 0;
      color: #2c3e50;
    }
    .search-input, .cluster-select {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: white;
      font-weight: bold;
      color: #334155;
      font-size: 0.85rem;
      box-sizing: border-box;
    }
    .card-container {
      width: 100%;
      max-width: 380px;
      margin-bottom: 15px;
    }
    .card {
      width: 100%;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.65rem;
      font-weight: bold;
      color: #fff;
      background-color: var(--primary-color);
    }
    .counter {
      font-size: 0.75rem;
      font-weight: bold;
      color: #64748b;
    }
    .drug-title {
      text-align: center;
      font-size: 1.25rem;
      font-weight: bold;
      margin: 5px 0 2px 0;
      color: #1e293b;
    }
    .drug-latin {
      text-align: center;
      font-style: italic;
      color: #64748b;
      font-size: 0.82rem;
      margin-bottom: 4px;
    }
    .drug-category {
      text-align: center;
      font-size: 0.8rem;
      font-weight: bold;
      color: #3498db;
      margin-bottom: 12px;
    }
    .info-section {
      font-size: 0.82rem;
      line-height: 1.4;
      margin-bottom: 10px;
    }
    .info-title {
      font-weight: bold;
      color: #1e293b;
      margin-bottom: 2px;
    }
    .mnemonic-box {
      background-color: #f8fafc;
      border-left: 4px solid #3498db;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      margin-top: 10px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 380px;
      margin-bottom: 20px;
    }
    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      text-align: center;
    }
    .btn-primary { background-color: #3498db; color: white; }
    .btn-secondary { background-color: #ecf0f1; color: #2c3e50; }

    /* Modal Sub/Lock Window */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 16px;
      max-width: 300px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>PharmaXotira</h1>
    <!-- Qidiruv maydoni qo'shildi -->
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Dori nomini yozib qidiring..." oninput="filterDrugs()">
    
    <select id="clusterSelect" class="cluster-select" onchange="filterDrugs()">
      <option value="ALL">Barcha bo'limlar (Hammasi)</option>
    </select>
  </div>

  <div class="card-container" id="cardContainer">
    <!-- Dynamic Card Content -->
  </div>

  <div class="btn-group">
    <button class="btn btn-secondary" onclick="prevCard()">⬅️ Oldingisi</button>
    <button class="btn btn-primary" onclick="nextCard()">Keyingisi ➡️</button>
  </div>

  <!-- Subscription Modal Lock -->
  <div class="modal" id="subModal">
    <div class="modal-content">
      <h2>📢 Kanallarga a'zo bo'ling</h2>
      <p style="font-size: 0.82rem; color: #64748b; margin-bottom: 15px;">
        Davom etish uchun quyidagi kanallarning barchasiga a'zo bo'lishingiz kerak:
      </p>
      <a href="https://t.me/fundamedical_academy" target="_blank" class="btn btn-primary" style="display: block; text-decoration: none; margin-bottom: 8px;">
        1️⃣ @fundamedical_academy
      </a>
      <a href="https://t.me/MedLife_Official" target="_blank" class="btn btn-primary" style="display: block; text-decoration: none; margin-bottom: 15px; background-color: #27ae60;">
        2️⃣ @MedLife_Official
      </a>
      <button class="btn btn-secondary" style="width: 100%;" onclick="verifySub()">
        ✅ A'zo bo'ldim (Tekshirish)
      </button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    tg?.expand();

    let allDrugs = [];
    let filteredDrugs = [];
    let currentIndex = 0;

    async function initApp() {
      try {
        const res = await fetch('/api/drugs');
        allDrugs = await res.json();
        
        populateClusters();
        filteredDrugs = [...allDrugs];
        renderCard();

        checkSubAccess();
      } catch (err) {
        console.error("Xatolik:", err);
      }
    }

    function populateClusters() {
      const select = document.getElementById('clusterSelect');
      const clusters = [...new Set(allDrugs.map(d => d.cluster))];
      
      clusters.forEach(c => {
        if (c) {
          const opt = document.createElement('option');
          opt.value = c;
          opt.innerText = c;
          select.appendChild(opt);
        }
      });
    }

    function filterDrugs() {
      const selectedCluster = document.getElementById('clusterSelect').value;
      const searchText = document.getElementById('searchInput').value.toLowerCase().trim();

      filteredDrugs = allDrugs.filter(drug => {
        const matchesCluster = (selectedCluster === 'ALL' || drug.cluster === selectedCluster);
        const matchesSearch = (
          (drug.name && drug.name.toLowerCase().includes(searchText)) ||
          (drug.latin_name && drug.latin_name.toLowerCase().includes(searchText)) ||
          (drug.mnemonic && drug.mnemonic.toLowerCase().includes(searchText))
        );
        return matchesCluster && matchesSearch;
      });

      currentIndex = 0;
      renderCard();
    }

    function renderCard() {
      const container = document.getElementById('cardContainer');
      
      if (!filteredDrugs.length) {
        container.innerHTML = `
          <div class="card" style="text-align: center; padding: 40px 20px;">
            <div style="font-size: 2.5rem; margin-bottom: 10px;">🔍</div>
            <div style="font-weight: bold; color: #64748b;">Dori topilmadi</div>
            <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 5px;">Boshqa so'z bilan qidirib ko'ring</div>
          </div>
        `;
        return;
      }

      const drug = filteredDrugs[currentIndex];

      container.innerHTML = `
        <div class="card">
          <div>
            <div class="card-header">
              <span class="badge">${drug.cluster || ''}</span>
              <span class="counter">${currentIndex + 1} / ${filteredDrugs.length}</span>
            </div>
            
            <div class="drug-title">${drug.icon || '💊'} ${drug.name || ''}</div>
            <div class="drug-latin">${drug.latin_name || ''}</div>
            <div class="drug-category">🏷️ ${drug.cluster ? drug.cluster.split(':')[1] || drug.cluster : ''}</div>
            
            <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 10px 0;">

            <div class="info-section">
              <div class="info-title">1. Dori shakllari</div>
              <div>${drug.form || ''}</div>
            </div>

            <div class="info-section">
              <div class="info-title">2. Qo‘llash usuli va dozalari</div>
              <div>${drug.dosage || ''}</div>
            </div>

            <div class="info-section">
              <div class="info-title">3. Ta'sir mexanizmi</div>
              <div>${drug.mechanism || ''}</div>
            </div>

            <div class="info-section">
              <div class="info-title">4. Qo‘llanilishi</div>
              <div>${drug.indications || ''}</div>
            </div>

            <div class="info-section">
              <div class="info-title">5. Nojo‘ya ta'sirlari</div>
              <div>${drug.side_effects || ''}</div>
            </div>
            
            <div class="mnemonic-box">
              <div class="info-title" style="margin-bottom: 3px;">6. Eslab qolish uchun</div>
              💡 <b>${drug.mnemonic || ''}</b>
            </div>
          </div>
        </div>
      `;
    }

    function nextCard() {
      if (currentIndex < filteredDrugs.length - 1) {
        currentIndex++;
        renderCard();
      }
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        renderCard();
      }
    }

    async function checkSubAccess() {
      const hasUsedBefore = localStorage.getItem('pharmaxotira_used_once');
      
      if (!hasUsedBefore) {
        localStorage.setItem('pharmaxotira_used_once', 'true');
        return;
      }

      const userId = tg?.initDataUnsafe?.user?.id;
      if (userId) {
        try {
          const res = await fetch(`/api/check-sub?user_id=${userId}`);
          const data = await res.json();
          if (!data.subscribed) {
            document.getElementById('subModal').style.display = 'flex';
          }
        } catch (e) {
          console.error("A'zolik tekshiruvida xatolik:", e);
        }
      }
    }

    async function verifySub() {
      const userId = tg?.initDataUnsafe?.user?.id;
      if (userId) {
        try {
          const res = await fetch(`/api/check-sub?user_id=${userId}`);
          const data = await res.json();
          if (data.subscribed) {
            document.getElementById('subModal').style.display = 'none';
            alert("Rahmat! A'zolik tasdiqlandi.");
          } else {
            alert(`Siz hali ${data.channel || 'kanal'}ga a'zo bo'lmadingiz.`);
          }
        } catch (e) {
          alert("Tekshirishda xatolik yuz berdi.");
        }
      } else {
        document.getElementById('subModal').style.display = 'none';
      }
    }

    window.onload = initApp;
  </script>
</body>
</html>
