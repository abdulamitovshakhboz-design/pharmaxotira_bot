<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PharmaXotira Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --primary-color: #3498db;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      text-align: center;
      margin-bottom: 15px;
      width: 100%;
      max-width: 380px;
    }
    .header h1 {
      font-size: 1.3rem;
      margin: 0;
      color: #2c3e50;
    }
    .cluster-select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: white;
      font-weight: bold;
      color: #334155;
      font-size: 0.85rem;
    }
    .card-container {
      width: 100%;
      max-width: 380px;
      margin-bottom: 15px;
    }
    .card {
      width: 100%;
      min-height: 380px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: bold;
      color: #fff;
      background-color: var(--primary-color);
    }
    .counter {
      font-size: 0.75rem;
      font-weight: bold;
      color: #64748b;
    }
    .icon-box {
      font-size: 3rem;
      text-align: center;
      margin: 5px 0;
    }
    .drug-title {
      text-align: center;
      font-size: 1.25rem;
      font-weight: bold;
      margin: 5px 0;
    }
    .drug-latin {
      text-align: center;
      font-style: italic;
      color: #7f8c8d;
      font-size: 0.85rem;
      margin-bottom: 12px;
    }
    .info-section {
      font-size: 0.82rem;
      line-height: 1.4;
      margin-bottom: 6px;
    }
    .info-title {
      font-weight: bold;
      color: #34495e;
    }
    .mnemonic-box {
      background-color: #e8f8f5;
      border-left: 4px solid #1abc9c;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.82rem;
      margin-top: 10px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 380px;
    }
    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      text-align: center;
    }
    .btn-primary { background-color: #3498db; color: white; }
    .btn-secondary { background-color: #ecf0f1; color: #2c3e50; }

    /* Modal Sub/Lock Window */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 16px;
      max-width: 300px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>PharmaXotira</h1>
    <select id="clusterSelect" class="cluster-select" onchange="filterCluster()">
      <option value="ALL">Барча бўлимлар (Ҳаммаси)</option>
    </select>
  </div>

  <div class="card-container" id="cardContainer">
    <!-- Dynamic Card Content -->
  </div>

  <div class="btn-group">
    <button class="btn btn-secondary" onclick="prevCard()">⬅️ Олдингиси</button>
    <button class="btn btn-primary" onclick="nextCard()">Keyingisi ➡️</button>
  </div>

  <!-- Subscription Modal Lock -->
  <div class="modal" id="subModal">
    <div class="modal-content">
      <h2>📢 Каналга аъзо бўлинг</h2>
      <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 20px;">
        Давом этиш ва сифатли фармакологик ресурслардан фойдаланиш учун <b>@fundamedical_academy</b> каналига аъзо бўлинг!
      </p>
      <a href="https://t.me/fundamedical_academy" target="_blank" class="btn btn-primary" style="display: block; text-decoration: none; margin-bottom: 10px;">
        👉 Каналга аъзо бўлиш
      </a>
      <button class="btn btn-secondary" style="width: 100%;" onclick="verifySub()">
        ✅ Аъзо бўлдим (Текшириш)
      </button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    tg?.expand();

    let allDrugs = [];
    let filteredDrugs = [];
    let currentIndex = 0;

    async function initApp() {
      try {
        const res = await fetch('/api/drugs');
        allDrugs = await res.json();
        
        populateClusters();
        filteredDrugs = [...allDrugs];
        renderCard();

        // 2-марта фойдаланишни ва канал аъзолигини текшириш
        checkSubAccess();
      } catch (err) {
        console.error("Xatolik:", err);
      }
    }

    function populateClusters() {
      const select = document.getElementById('clusterSelect');
      const clusters = [...new Set(allDrugs.map(d => d.cluster))];
      
      clusters.forEach(c => {
        if (c) {
          const opt = document.createElement('option');
          opt.value = c;
          opt.innerText = c;
          select.appendChild(opt);
        }
      });
    }

    function filterCluster() {
      const selected = document.getElementById('clusterSelect').value;
      if (selected === 'ALL') {
        filteredDrugs = [...allDrugs];
      } else {
        filteredDrugs = allDrugs.filter(d => d.cluster === selected);
      }
      currentIndex = 0;
      renderCard();
    }

    function renderCard() {
      if (!filteredDrugs.length) return;
      const drug = filteredDrugs[currentIndex];
      const container = document.getElementById('cardContainer');

      container.innerHTML = `
        <div class="card">
          <div>
            <div class="card-header">
              <span class="badge">${drug.cluster || ''}</span>
              <span class="counter">${currentIndex + 1} / ${filteredDrugs.length}</span>
            </div>
            <div class="icon-box">${drug.icon || '💊'}</div>
            <div class="drug-title">${drug.name || ''}</div>
            <div class="drug-latin">${drug.latin_name || ''}</div>
            
            <div class="info-section"><span class="info-title">Чиқарилиш шакли:</span> ${drug.form || ''}</div>
            <div class="info-section"><span class="info-title">Доза ва йўллари:</span> ${drug.dosage || ''}</div>
            <div class="info-section"><span class="info-title">Таъсир механизми:</span> ${drug.mechanism || ''}</div>
            <div class="info-section"><span class="info-title">Кўрсатмалар:</span> ${drug.indications || ''}</div>
            <div class="info-section"><span class="info-title">Ножўя таъсири:</span> ${drug.side_effects || ''}</div>
            
            <div class="mnemonic-box">💡 <b>Мнемоника:</b> ${drug.mnemonic || ''}</div>
          </div>
        </div>
      `;
    }

    function nextCard() {
      if (currentIndex < filteredDrugs.length - 1) {
        currentIndex++;
        renderCard();
      }
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        renderCard();
      }
    }

    async function checkSubAccess() {
      const hasUsedBefore = localStorage.getItem('pharmaxotira_used_once');
      
      if (!hasUsedBefore) {
        // 1-марта фойдаланиш: бемалол ўтказиб юборамиз
        localStorage.setItem('pharmaxotira_used_once', 'true');
        return;
      }

      // 2-марта ва ундан кейин аъзоликни текширамиз
      const userId = tg?.initDataUnsafe?.user?.id;
      if (userId) {
        try {
          const res = await fetch(`/api/check-sub?user_id=${userId}`);
          const data = await res.json();
          if (!data.subscribed) {
            document.getElementById('subModal').style.display = 'flex';
          }
        } catch (e) {
          console.error("Аъзолик текширувида хатолик:", e);
        }
      }
    }

    async function verifySub() {
      const userId = tg?.initDataUnsafe?.user?.id;
      if (userId) {
        const res = await fetch(`/api/check-sub?user_id=${userId}`);
        const data = await res.json();
        if (data.subscribed) {
          document.getElementById('subModal').style.display = 'none';
          alert("Раҳмат! Аъзолик тасдиқланди.");
        } else {
          alert("Сиз ҳали @fundamedical_academy каналига аъзо бўлмадингиз.");
        }
      } else {
        document.getElementById('subModal').style.display = 'none';
      }
    }

    window.onload = initApp;
  </script>
</body>
</html>
